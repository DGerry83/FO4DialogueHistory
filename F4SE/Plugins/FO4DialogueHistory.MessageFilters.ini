; FO4 Dialogue History — Message History prefix exclusions
;
; Each ExcludedPrefix rejects messages whose text STARTS WITH that exact,
; case-sensitive prefix. Add one entry per line under [MessageFilters].
; Spaces inside a prefix are significant; surrounding INI whitespace is trimmed.
; Keep prefixes specific so legitimate notifications are not hidden from history.
; Full-line comments beginning with ';' or '#' and empty entries are ignored.
; Restart the game after editing this file. No rules are built into the DLL.
;
; Example:
; ExcludedPrefix = |ExampleWidgetMod|

[MessageFilters]
ExcludedPrefix = |HUDFramework|
ExcludedPrefix = | CompanionStatusEnhanced |
