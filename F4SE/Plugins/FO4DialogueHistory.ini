[Settings]
; DirectX scan code for the history panel toggle key.
; Default 35 = H (provisional — change here if it conflicts with your setup).
Hotkey = 35

; Maximum retained dialogue lines. 0 = unlimited (default; nothing is
; evicted). Set 10-500 to cap the buffer (oldest lines are dropped first).
BufferSize = 0

; Base UI font size in px (10-32).
FontSize = 16

; Panel geometry — written by the plugin when you move or resize the panel.
; All four values must be present and valid (min 320x200) or the default
; centered layout is used. Coordinates are pixels from the viewport top-left.
;PanelX = 100
;PanelY = 100
;PanelWidth = 768
;PanelHeight = 540
