[Settings]
; Key that toggles the history panel. Accepts a key name (case-insensitive):
; any letter ("H"), F1-F12, "Space", "Enter", "Tab", "Escape", "Backspace",
; "CapsLock", "LShift"/"RShift", "LCtrl"/"RCtrl", "LAlt"/"RAlt", the arrows
; ("Up"/"Down"/"Left"/"Right"), "Home"/"End"/"PageUp"/"PageDown"/"Insert"/
; "Delete", "Numpad0"-"Numpad9", "NumPlus"/"NumMinus"/"NumMultiply"/
; "NumDivide"/"NumDecimal"/"NumEnter"/"NumLock", or a punctuation name
; ("Minus", "Equals", "Comma", "Period", "Slash", "Backslash", "Semicolon",
; "Apostrophe", "Grave", "LBracket", "RBracket").
; A pure number is read as a raw DirectInput scan code (0-255), e.g. 35 = H.
Hotkey = H

; Maximum retained dialogue lines. 0 = unlimited (default; nothing is
; evicted). Set 10-500 to cap the buffer (oldest lines are dropped first).
BufferSize = 0

; Base UI font size in px (10-32).
FontSize = 16

[Diagnostics]
; Verbose capture logging. 1 = one Information-level line per subtitle event
; (accepted and rejected alike) in the F4SE log: speaker, flags, quest
; attribution, filter verdict, and the line text (truncated to ~60 chars).
; 0 = off (default). The key may also be left out entirely.
VerboseCapture = 0

; --- Stress-test injector (synthetic dialogue for render/load testing) ---
; One press of StressTestKey injects ONE batch of StressTestLines synthetic
; lines across StressTestQuests synthetic quests into the real history
; buffer. All injected quests are synthetic (questId 0xFF000000+), so
; clear-quest on a "Stress ..." entry is safe — it can never touch a real
; quest.
; WARNING: injected lines are written into the cosave if you save the game.
; Use a throwaway save slot, or clear history before saving for real.
; WARNING: with a capped BufferSize the injected lines evict each other —
; keep BufferSize = 0 (default, unlimited) or set it as high as the batch
; needs (BufferSize caps at 500).
; Inject key; same key-name syntax as Hotkey above ("F2", "Numpad0", ...).
; 0 / "off" = disabled (default — the injector is inert until you set a key).
; StressTestKey = F2
StressTestKey = 0

; Lines per injected batch, 1-5000 (default 500; out-of-range values are
; clamped with a log warning).
StressTestLines = 500

; Distinct synthetic quests per batch, 1-100 (default 20).
StressTestQuests = 20
