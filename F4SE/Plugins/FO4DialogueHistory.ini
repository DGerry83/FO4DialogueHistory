[Settings]
; Key that toggles the history panel. Accepts a key name (case-insensitive):
; any letter ("H"), F1-F12, "Space", "Enter", "Tab", "Escape", "Backspace",
; "CapsLock", "LShift"/"RShift", "LCtrl"/"RCtrl", "LAlt"/"RAlt", the arrows
; ("Up"/"Down"/"Left"/"Right"), "Home"/"End"/"PageUp"/"PageDown"/"Insert"/
; "Delete", "Numpad0"-"Numpad9", "NumPlus"/"NumMinus"/"NumMultiply"/
; "NumDivide"/"NumDecimal"/"NumEnter"/"NumLock", or a punctuation name
; ("Minus", "Equals", "Comma", "Period", "Slash", "Backslash", "Semicolon",
; "Apostrophe", "Grave", "LBracket", "RBracket").
; A pure number is read as a raw DirectInput scan code (0-255), e.g. 35 = H.
Hotkey = H

; Gamepad button (or chord) that toggles the history panel. Requires a
; controller. Accepts a button name (case-insensitive): "DUp", "DDown",
; "DLeft", "DRight", "Start", "Back", "LS", "RS", "LB", "RB", "A", "B",
; "X", "Y", "LT", "RT"; a chord "Mod+Trigger" with exactly one '+' and two
; distinct buttons ("LB+DUp"); or a bare decimal code, accepted only when it
; exactly equals a known button's mask (1/2/4/8 = D-pad, 16/32 = Start/Back,
; 64/128 = LS/RS, 256/512 = LB/RB, 4096/8192/16384/32768 = A/B/X/Y,
; 9/10 = LT/RT).
; NOTE: RB and RT are never delivered as button events by the engine (their
; in-game actions are read outside the event stream) — a binding using them
; will never fire; pick any other button.
; Empty or absent = disabled.
GamepadHotkey = LB+DUp

; While a panel text box (a search field) is focused, keyboard input is
; captive: the panel's own Hotkey is ALWAYS suppressed while typing (typing
; an "H" can't close the panel), and with this setting at 1 every typed key
; is also consumed before it reaches the game or other mods' hotkeys — press
; and release alike (typed keys still reach the panel itself) — AND gameplay
; input (WASD movement, camera, activate, jumping, VATS, ...) is blocked for
; the same span (menus and the console keep working). 1 = on (default).
; Set 0 only if the input blocking misbehaves on your runtime; the
; own-hotkey suppression while typing stays on regardless.
ExclusiveTypingInput = 1

; Maximum retained dialogue lines. 0 = unlimited (default; nothing is
; evicted). Set 10-500 to cap the buffer (oldest lines are dropped first).
BufferSize = 0

; Base UI font size in px (10-32).
FontSize = 16

[Diagnostics]
; Verbose capture logging. 1 = one Information-level line per subtitle event
; (accepted and rejected alike) in the F4SE log: speaker, flags, quest
; attribution, filter verdict, and the line text (truncated to ~60 chars).
; 0 = off (default). The key may also be left out entirely.
VerboseCapture = 0

; Key-bind probe. 1 = one Information-level line per keyboard press the
; engine delivers ("input probe: key press code N (0xNN)"), tagged when it
; matches your Hotkey/StressTestKey bind. While the probe is on, gamepad
; button events are logged the same way — one line per event with device,
; idCode, analog value, hold time, and press state ("input probe: gamepad
; button idCode N (0xNN) value V held Hs state S"). Use it to diagnose a
; key that won't bind: enable, load a save, tap the key a few times, quit,
; and read the F4SE log. If the key produces NO line, the engine never
; delivers it to plugins and it cannot be bound. 0 = off (default).
KeyProbe = 0

; --- Stress-test injector (synthetic dialogue for render/load testing) ---
; One press of StressTestKey injects ONE batch of StressTestLines synthetic
; lines across StressTestQuests synthetic quests into the real history
; buffer. All injected quests are synthetic (questId 0xFF000000+), so
; clear-quest on a "Stress ..." entry is safe — it can never touch a real
; quest.
; WARNING: injected lines are written into the cosave if you save the game.
; Use a throwaway save slot, or clear history before saving for real.
; WARNING: with a capped BufferSize the injected lines evict each other —
; keep BufferSize = 0 (default, unlimited) or set it as high as the batch
; needs (BufferSize caps at 500).
; Inject key; same key-name syntax as Hotkey above ("F2", "Numpad0", ...).
; 0 / "off" = disabled (default — the injector is inert until you set a key).
; StressTestKey = F2
StressTestKey = 0

; Lines per injected batch, 1-5000 (default 500; out-of-range values are
; clamped with a log warning).
StressTestLines = 500

; Distinct synthetic quests per batch, 1-100 (default 20).
StressTestQuests = 20
